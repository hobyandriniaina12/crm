<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:insert="~{/general/head.html}"></div>
<meta name="_csrf" content="${_csrf.token}"/>
<meta name="_csrf_header" content="${_csrf.headerName}"/>
<link rel="stylesheet" th:href="@{/css/bootstrap-wysihtml5.css}"/>
<!-- Editable CSS -->

<!-- Custom CSS -->
<link th:href="@{/css/style.min.css}" rel="stylesheet">
<!-- page css -->
<link th:href="@{/css/pages/inbox.css}" rel="stylesheet">

<link th:href="@{/css/ribbon-page.css}" rel="stylesheet">

</head>
<body class="skin-blue fixed-layout">
    <div class="preloader">
        <div class="loader">
            <div class="loader__figure"></div>
            <p class="loader__label">CRM</p>
        </div>
    </div>
    
    <div id="main-wrapper">
        <!-- ============================================================== -->
        <!-- Topbar header - style you can find in pages.scss -->
        <!-- ============================================================== -->
        <div th:insert="~{/general/header.html}"></div>
        <!-- ============================================================== -->
        <!-- End Topbar header -->
        <!-- ============================================================== -->
        <!-- ============================================================== -->
        <!-- Left Sidebar - style you can find in sidebar.scss  -->
        <!-- ============================================================== -->
        <div th:insert="~{/general/left-sidebar.html}"></div>
        <!-- ============================================================== -->
        <!-- End Left Sidebar - style you can find in sidebar.scss  -->
        <!-- ============================================================== -->
        <!-- ============================================================== -->
        <!-- Page wrapper  -->
        <!-- ============================================================== -->
        <div class="page-wrapper">
            <!-- ============================================================== -->
            <!-- Container fluid  -->
            <!-- ============================================================== -->
            <div class="container-fluid">
                <!-- ============================================================== -->
                <!-- Bread crumb and right sidebar toggle -->
                <!-- ============================================================== -->
                <div th:insert="~{/general/page-titles.html}"></div>
    
                <div class="row">
                    <div class="col-lg-12">
                        <div class="card">
                            <div class="card-body">
                                <h4 class="card-title">Import CSV</h4>
    
    
                                    <form th:action="@{/import}" method="post" enctype="multipart/form-data">
                                        <label for="importType">Type d'import :</label>
                                        <select id="importType" name="importType" onchange="toggleFields()">
                                            <option value="single">Un seul fichier CSV pour toutes les tables</option>
                                            <option value="multiple">Un fichier CSV par table</option>
                                        </select>

                                        <div id="singleFileField">
                                            <label for="singleCsv">Fichier CSV global :</label>
                                            <input type="file" id="singleCsv" name="singleCsv" accept=".csv">
                                        </div>

                                        <div id="multipleFilesFields" style="display: none;"> 
                                            <label>Fichiers CSV par table :</label><br>
                                        
                                            <div style="margin-bottom: 5px;"><input type="file" name="csvFiles" accept=".csv"> Customer</div>
                                            <div style="margin-bottom: 5px;"><input type="file" name="csvFiles" accept=".csv"> Customer Login Info</div>
                                            <div style="margin-bottom: 5px;"><input type="file" name="csvFiles" accept=".csv"> Users</div>
                                            <div style="margin-bottom: 5px;"><input type="file" name="csvFiles" accept=".csv"> Oauth_users</div>
                                            <div style="margin-bottom: 5px;"><input type="file" name="csvFiles" accept=".csv"> User_profiles</div>
                                            <div style="margin-bottom: 5px;"><input type="file" name="csvFiles" accept=".csv"> Role</div>
                                            <div style="margin-bottom: 5px;"><input type="file" name="csvFiles" accept=".csv"> Email template</div>
                                            <div style="margin-bottom: 5px;"><input type="file" name="csvFiles" accept=".csv"> Trigger Lead</div>
                                            <div style="margin-bottom: 5px;"><input type="file" name="csvFiles" accept=".csv"> Trigger_ticket</div>
                                            <div style="margin-bottom: 5px;"><input type="file" name="csvFiles" accept=".csv"> Trigger_contract</div>
                                            <div style="margin-bottom: 5px;"><input type="file" name="csvFiles" accept=".csv"> Contract Setting</div>
                                            <div style="margin-bottom: 5px;"><input type="file" name="csvFiles" accept=".csv"> Lead action</div>
                                            <div style="margin-bottom: 5px;"><input type="file" name="csvFiles" accept=".csv"> Lead_setting</div>
                                            <div style="margin-bottom: 5px;"><input type="file" name="csvFiles" accept=".csv"> Ticket setting</div>
                                            <div style="margin-bottom: 5px;"><input type="file" name="csvFiles" accept=".csv"> File</div>
                                            <div style="margin-bottom: 5px;"><input type="file" name="csvFiles" accept=".csv"> Google drive file</div>
                                        </div>
                                        

                                        <button type="submit" class="btn btn-primary">Importer</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
        <!-- ============================================================== -->
                    <!-- End Page Content -->
                    <!-- ============================================================== -->
                    <!-- ============================================================== -->
                    <!-- Right sidebar -->
                    <!-- ============================================================== -->
                    <!-- .right-sidebar -->
                    <div th:insert="~{/general/right-sidebar.html}"></div>
                    <!-- ============================================================== -->
                    <!-- End Right sidebar -->
                    <!-- ============================================================== -->
                </div>
                <!-- ============================================================== -->
                <!-- End Container fluid  -->
                <!-- ============================================================== -->
            </div>
            <!-- ============================================================== -->
            <!-- End Page wrapper  -->
            <!-- ============================================================== -->
            <!-- ============================================================== -->
            <!-- footer -->
            <!-- ============================================================== -->
            <div th:insert="~{/general/footer.html}"></div>
            <!-- ============================================================== -->
            <!-- End footer -->
            <!-- ============================================================== -->
    </div>
    <script>
        function toggleFields() {
            let type = document.getElementById("importType").value;
            document.getElementById("singleFileField").style.display = (type === "single") ? "block" : "none";
            document.getElementById("multipleFilesFields").style.display = (type === "multiple") ? "block" : "none";
        }
    </script>

    <script th:inline="javascript">
        var home = /*[[${home}]]*/ null;
    </script>
    <script th:src="@{/js/library/jquery-3.2.1.min.js}" type="text/javascript">></script>
    <!--    &lt;!&ndash; Bootstrap tether Core JavaScript &ndash;&gt;-->
    <script th:src="@{/js/library/popper.min.js}" type="text/javascript">></script>
    <script th:src="@{/js/library/bootstrap.min.js}" type="text/javascript">></script>
    <!--    &lt;!&ndash; slimscrollbar scrollbar JavaScript &ndash;&gt;-->
    <script th:src="@{/js/library/perfect-scrollbar.jquery.min.js}" type="text/javascript">></script>
    <!--Wave Effects -->
    <script th:src="@{/js/library/waves.js}" type="text/javascript">></script>
    <!--Menu sidebar -->
    <script th:src="@{/js/library/sidebarmenu.js}" type="text/javascript">></script>
    <!--stickey kit -->
    <script th:src="@{/js/library/sticky-kit.min.js}"></script>
    <script th:src="@{/js/library/jquery.sparkline.min.js}" type="text/javascript">></script>
    <!--Custom JavaScript -->
    <script th:src="@{/js/library/custom.min.js}" type="text/javascript">></script>
    <!-- Editable -->
    
    <script th:src="@{/js/library/wysihtml5-0.3.0.js}"></script>
    <script th:src="@{/js/library/bootstrap-wysihtml5.js}"></script>
    <script>
        $(document).ready(function() {
            $('.textarea_editor').wysihtml5();
        });
    </script>
    
</body>
</html>
